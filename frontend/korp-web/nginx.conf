server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # A aplicação é uma SPA: qualquer rota desconhecida devolve o index.html
    # para o roteador do Angular resolver no cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
